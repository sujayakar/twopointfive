# The top: every module by its old path, and what asks a rule by its row from outside (the call table, the menu's questions).
[workspace]

[package]
name = "game"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
game_types = { path = "../game_types" }
