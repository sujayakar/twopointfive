# THE GAME'S OWN START, IN RUST: a level file's text and the character's files in, a `Game` the tick can run out, with nothing made by TypeScript
# (README.md). The scene builder for tests is its front: a scene of a few lines is written as a level file and stood by the same start.
# Its own workspace, like game, game_run and game_face; it builds into rust/game_start/target (ignored).
[workspace]

[package]
name = "game_start"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
game = { path = "../game_rules", package = "game_rules" }
sim = { path = "../sim" }
# (hold draws what it plays)
game_draw = { path = "../game_draw", optional = true }

[profile.dev]
opt-level = 0
debug = false

[profile.test]
opt-level = 1
debug = false

[features]
# `std`: the readers of this repository's own files (the character, a level) for a native host and the tests. The start itself reads no file.
default = ["std"]
std = ["dep:game_draw"]

# THE GATE'S OWN BUILD (`cargo build --profile gate --bin gate`): what is run once or twice after an edit is built cheaply, and a pin depends on no profile.
[profile.gate]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 256
incremental = true
