# WHAT A HOST DOES ROUND A STEP OF THE GAME (src/lib.rs). Its own workspace, like game_rules and game_face; it builds into rust/game_run/target (ignored).
[workspace]

[package]
name = "game_run"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
game = { path = "../game_rules", package = "game_rules" }
sim = { path = "../sim" }
game_start = { path = "../game_start", default-features = false }

[dev-dependencies]
game_start = { path = "../game_start" }

[profile.dev]
opt-level = 0
debug = false
