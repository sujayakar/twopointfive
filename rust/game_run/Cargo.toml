# THE RUST GAME'S NATIVE RUNNER: test binaries for tools/blitz/run.sh. `mission` imports a state the TypeScript game exported, steps the translated tick
# through a whole mission and compares rust/sim's block and the die after every tick; `where_parts` says where two blocks differ. A native debug build: a
# panic has a message, a place and a backtrace. Its own workspace, like game and game_face; it builds into rust/game_run/target (ignored).
[workspace]

[package]
name = "game_run"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
game = { path = "../game" }
sim = { path = "../sim" }
game_start = { path = "../game_start", default-features = false }

[profile.dev]
opt-level = 0
debug = false
