# The game's state as bytes: the bridge's export and import, the filtered export, each type's own way onto the wire. May name the data only, no rule.
[workspace]

[package]
name = "game_wire"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
game_types = { path = "../game_types" }
sim = { path = "../sim" }
prim = { path = "../prim" }

[profile.dev]
opt-level = 0
debug = false
