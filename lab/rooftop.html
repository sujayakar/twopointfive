<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooftop Light Lab</title>
<style>
:root{--red:#e8121c;--ink:#111418;--line:rgba(255,255,255,.28)}
html,body{margin:0;height:100%;background:#dfe6ea;overflow:hidden;font:500 13px/1.4 "Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
#top{position:fixed;left:22px;top:18px;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.35)}
#top b{display:block;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}#top i{font-style:normal;display:block;margin-top:6px;opacity:.9}
#panel{position:fixed;right:18px;top:18px;width:232px;background:rgba(14,17,21,.80);border-left:3px solid var(--red);padding:14px 16px;display:flex;flex-direction:column;gap:11px;max-height:calc(100vh - 64px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#panel label{display:flex;justify-content:space-between;align-items:center;gap:10px}#panel .row{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:#fff;background:rgba(255,255,255,.10);border:0;padding:5px 9px;cursor:pointer}button:hover{background:rgba(255,255,255,.2)}button.on{background:var(--red)}.small button{font-size:11px;padding:3px 6px}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:1px}
input[type=range]{width:128px;accent-color:var(--red)}
#stats{font:500 11px/1.5 ui-monospace,Menlo,monospace;white-space:pre;opacity:.92;overflow-x:auto;flex:none}
#keys{position:fixed;left:22px;bottom:16px;opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.5);font-size:12px;pointer-events:none}
#bench{position:fixed;left:22px;top:18px;margin:0;max-height:calc(100vh - 36px);overflow:auto;background:rgba(14,17,21,.86);border-left:3px solid var(--red);padding:16px 20px;font:500 13px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
#error{position:fixed;left:22px;bottom:60px;right:280px;background:#300;color:#fdd;padding:12px;white-space:pre-wrap;font:12px ui-monospace,monospace;max-height:40vh;overflow:auto}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#eef2f4;color:var(--ink);transition:opacity .8s}#load div{width:min(340px,80vw)}#load b{font-size:40px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}#load span{display:block;height:4px;background:#d4dadd;margin-top:18px}#load em{display:block;height:100%;width:2%;background:var(--red)}#load p{margin:10px 0 0;color:#555}
#teach{position:fixed;inset:0;pointer-events:none;font-size:13px;line-height:1.45}#teach[hidden]{display:none}#teach>*{pointer-events:auto;position:absolute;background:rgba(12,15,19,.84);backdrop-filter:blur(14px)}
#teach button{font-size:12px;padding:4px 9px}#teach header{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.9}
.t-card{left:16px;top:16px;width:350px;max-height:calc(58vh - 24px);overflow-y:auto;border-left:3px solid var(--red);padding:12px 16px 14px;box-sizing:border-box;scrollbar-width:thin}
.t-card h2{margin:8px 0 6px;font-size:21px;line-height:1.12;letter-spacing:-.01em}.t-card p{margin:8px 0 0}.t-why{color:#b9c3cc}
.t-sig{display:block;font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#ffd7a8;white-space:pre-wrap}
.t-types{margin-top:10px;font:500 11px/1.6 ui-monospace,Menlo,monospace;color:#aeb9c2}.t-types b{color:#fff;font-weight:600}.t-types span{color:#8a96a0}.t-types i{font-style:normal;display:inline-block;width:30px}.t-types .in{color:#79b4f2}.t-types .out{color:#b39df0}.t-types .buf{color:#5fc9b0}
.t-list{left:16px;top:calc(58vh + 4px);bottom:16px;width:350px;overflow-y:auto;border-left:3px solid var(--red);padding:6px 8px;box-sizing:border-box;scrollbar-width:thin}.t-list h3{font-size:11px;margin:8px 8px 3px;color:#9fabb5;font-weight:600}
#teach .t-list button{display:flex;width:100%;gap:8px;background:none;text-align:left;padding:4px 8px;font-size:13px}#teach .t-list button:hover{background:rgba(255,255,255,.1)}#teach .t-list button.on{background:var(--red)}.t-list b{width:18px;font-weight:600;opacity:.7}.t-list em{margin-left:auto;font:500 11px ui-monospace,Menlo,monospace;opacity:.75;align-self:center}
.t-bar{left:382px;right:342px;bottom:16px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}.t-bar>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.t-bar span{font-size:12px;opacity:.75;margin:0 3px 0 9px}.t-parts button{opacity:.8}.t-note{font-size:12px;color:#c9d2d9}
.t-probe{right:16px;bottom:16px;width:310px;padding:8px 12px 10px;box-sizing:border-box}.t-probe h3{margin:0 0 4px;font-size:12px}#t-rows>div{display:flex;justify-content:space-between;gap:10px;font:500 11px/1.65 ui-monospace,Menlo,monospace;color:#9aa6b0}#t-rows>div.hot{color:#fff}#t-rows b{font-weight:500}#t-rows span{text-align:right;white-space:pre}#t-rows i{display:inline-block;width:9px;height:9px;margin-right:6px}
#eye{position:fixed;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.55),inset 0 0 0 5px rgba(0,0,0,.35);pointer-events:none;box-sizing:border-box}#eye[hidden]{display:none}#pins button{position:fixed;left:-8px;top:-8px;width:16px;height:16px;padding:0;border-radius:50%;background:rgba(255,236,190,.85);border:2px solid rgba(20,24,28,.75);opacity:.4}#pins button:hover,#pins button:focus-visible{opacity:1}#pins button.off{background:rgba(20,24,28,.6);border-color:rgba(255,255,255,.75);opacity:.75}#show{display:none;position:fixed;right:18px;top:18px;background:rgba(14,17,21,.62)}body.nopanel #panel{display:none}body.nopanel #show{display:block}body.teaching #show,body.bare #show{display:none}#hide{justify-content:flex-end;margin-bottom:-4px}#teach.slim .t-probe,#teach.slim .t-list,#teach.bar .t-probe,#teach.bar .t-list,#teach.bar .t-card{display:none}#teach.slim .t-bar{right:16px}#teach.bar .t-bar{left:16px;right:16px}.t-bar>.t-knobs{gap:6px 16px}.t-knobs label{display:flex;align-items:center;gap:8px;font-size:12px}.t-knobs input{width:120px}.t-knobs output{font:500 11px ui-monospace,Menlo,monospace;min-width:38px}
#perf{position:fixed;left:18px;right:270px;bottom:44px;background:rgba(12,15,19,.92);border-left:3px solid var(--red);padding:10px 14px;font-size:12px;max-height:62vh;overflow:auto}#perf[hidden]{display:none}#perf header{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}#perf header span{flex:1;opacity:.85}#perf canvas{width:100%;height:150px;display:block;cursor:default}#pf-rows{font:500 11px/1.5 ui-monospace,Menlo,monospace;white-space:pre;margin-top:8px;overflow-x:auto}#perf button{font-size:12px;padding:4px 9px}@media(max-width:800px){#perf{right:18px}}
body.teaching #pins,body.bare #pins{display:none}
body.teaching #panel,body.teaching #keys,body.teaching #top{display:none}
@media(max-width:900px){.t-probe{display:none}.t-bar{right:16px}}@media(max-width:700px){.t-card,.t-list{width:auto;right:16px}.t-list{display:none}.t-card{max-height:34vh}.t-bar{left:16px}}
body.bare #panel,body.bare #keys,body.bare #top{display:none}
