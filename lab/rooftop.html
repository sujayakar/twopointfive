<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rooftop Light Lab</title>
<style>
:root{--red:#e8121c;--ink:#111418;--line:rgba(255,255,255,.28)}
html,body{margin:0;height:100%;background:#dfe6ea;overflow:hidden;font:500 13px/1.4 "Helvetica Neue",Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
#top{position:fixed;left:22px;top:18px;pointer-events:none;text-shadow:0 1px 12px rgba(0,0,0,.35)}
#top b{display:block;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}#top i{font-style:normal;display:block;margin-top:6px;opacity:.9}
#panel{position:fixed;right:18px;top:18px;width:232px;background:rgba(14,17,21,.80);border-left:3px solid var(--red);padding:14px 16px;display:flex;flex-direction:column;gap:11px;max-height:calc(100vh - 64px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#panel label{display:flex;justify-content:space-between;align-items:center;gap:10px}#panel .row{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;color:#fff;background:rgba(255,255,255,.10);border:0;padding:5px 9px;cursor:pointer}button:hover{background:rgba(255,255,255,.2)}button.on{background:var(--red)}.small button{font-size:11px;padding:3px 6px}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:1px}
input[type=range]{width:128px;accent-color:var(--red)}
#stats{font:500 11px/1.5 ui-monospace,Menlo,monospace;white-space:pre;opacity:.92;overflow-x:auto;flex:none}
#keys{position:fixed;left:22px;bottom:16px;opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.5);font-size:12px;pointer-events:none}
#bench{position:fixed;left:22px;top:18px;margin:0;max-height:calc(100vh - 36px);overflow:auto;background:rgba(14,17,21,.86);border-left:3px solid var(--red);padding:16px 20px;font:500 13px/1.45 ui-monospace,Menlo,monospace;white-space:pre}
#error{position:fixed;left:22px;bottom:60px;right:280px;background:#300;color:#fdd;padding:12px;white-space:pre-wrap;font:12px ui-monospace,monospace;max-height:40vh;overflow:auto}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#eef2f4;color:var(--ink);transition:opacity .8s}#load div{width:min(340px,80vw)}#load b{font-size:40px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}#load span{display:block;height:4px;background:#d4dadd;margin-top:18px}#load em{display:block;height:100%;width:2%;background:var(--red)}#load p{margin:10px 0 0;color:#555}
#teach{position:fixed;inset:0;pointer-events:none;font-size:13px;line-height:1.45}#teach[hidden]{display:none}#teach>*{pointer-events:auto;position:absolute;background:rgba(12,15,19,.84);backdrop-filter:blur(14px)}
#teach button{font-size:12px;padding:4px 9px}#teach header{display:flex;justify-content:space-between;align-items:center;font-size:12px;opacity:.9}
.t-card{left:16px;top:16px;width:350px;max-height:calc(58vh - 24px);overflow-y:auto;border-left:3px solid var(--red);padding:12px 16px 14px;box-sizing:border-box;scrollbar-width:thin}
.t-card h2{margin:8px 0 6px;font-size:21px;line-height:1.12;letter-spacing:-.01em}.t-card p{margin:8px 0 0}.t-why{color:#b9c3cc}
.t-sig{display:block;font:500 12px/1.5 ui-monospace,Menlo,monospace;color:#ffd7a8;white-space:pre-wrap}
.t-types{margin-top:10px;font:500 11px/1.6 ui-monospace,Menlo,monospace;color:#aeb9c2}.t-types b{color:#fff;font-weight:600}.t-types span{color:#8a96a0}.t-types i{font-style:normal;display:inline-block;width:30px}.t-types .in{color:#79b4f2}.t-types .out{color:#b39df0}.t-types .buf{color:#5fc9b0}
.t-list{left:16px;top:calc(58vh + 4px);bottom:16px;width:350px;overflow-y:auto;border-left:3px solid var(--red);padding:6px 8px;box-sizing:border-box;scrollbar-width:thin}.t-list h3{font-size:11px;margin:8px 8px 3px;color:#9fabb5;font-weight:600}
#teach .t-list button{display:flex;width:100%;gap:8px;background:none;text-align:left;padding:4px 8px;font-size:13px}#teach .t-list button:hover{background:rgba(255,255,255,.1)}#teach .t-list button.on{background:var(--red)}.t-list b{width:18px;font-weight:600;opacity:.7}.t-list em{margin-left:auto;font:500 11px ui-monospace,Menlo,monospace;opacity:.75;align-self:center}
.t-bar{left:382px;right:342px;bottom:16px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}.t-bar>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.t-bar span{font-size:12px;opacity:.75;margin:0 3px 0 9px}.t-parts button{opacity:.8}.t-note{font-size:12px;color:#c9d2d9}
.t-probe{right:16px;bottom:16px;width:310px;padding:8px 12px 10px;box-sizing:border-box}.t-probe h3{margin:0 0 4px;font-size:12px}#t-rows>div{display:flex;justify-content:space-between;gap:10px;font:500 11px/1.65 ui-monospace,Menlo,monospace;color:#9aa6b0}#t-rows>div.hot{color:#fff}#t-rows b{font-weight:500}#t-rows span{text-align:right;white-space:pre}#t-rows i{display:inline-block;width:9px;height:9px;margin-right:6px}
#eye{position:fixed;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.55),inset 0 0 0 5px rgba(0,0,0,.35);pointer-events:none;box-sizing:border-box}#eye[hidden]{display:none}#pins button{position:fixed;left:-8px;top:-8px;width:16px;height:16px;padding:0;border-radius:50%;background:rgba(255,236,190,.85);border:2px solid rgba(20,24,28,.75);opacity:.4}#pins button:hover,#pins button:focus-visible{opacity:1}#pins button.off{background:rgba(20,24,28,.6);border-color:rgba(255,255,255,.75);opacity:.75}#show{display:none;position:fixed;right:18px;top:18px;background:rgba(14,17,21,.62)}body.nopanel #panel{display:none}body.nopanel #show{display:block}body.teaching #show,body.bare #show{display:none}#hide{justify-content:flex-end;margin-bottom:-4px}#teach.slim .t-probe,#teach.slim .t-list,#teach.bar .t-probe,#teach.bar .t-list,#teach.bar .t-card{display:none}#teach.slim .t-bar{right:16px}#teach.bar .t-bar{left:16px;right:16px}.t-bar>.t-knobs{gap:6px 16px}.t-knobs label{display:flex;align-items:center;gap:8px;font-size:12px}.t-knobs input{width:120px}.t-knobs output{font:500 11px ui-monospace,Menlo,monospace;min-width:38px}
#perf{position:fixed;left:18px;right:270px;bottom:44px;background:rgba(12,15,19,.92);border-left:3px solid var(--red);padding:10px 14px;font-size:12px;max-height:62vh;overflow:auto}#perf[hidden]{display:none}#perf header{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}#perf header span{flex:1;opacity:.85}#perf canvas{width:100%;height:150px;display:block;cursor:default}#pf-rows{font:500 11px/1.5 ui-monospace,Menlo,monospace;white-space:pre;margin-top:8px;overflow-x:auto}#perf button{font-size:12px;padding:4px 9px}@media(max-width:800px){#perf{right:18px}}
body.teaching #pins,body.bare #pins{display:none}
body.teaching #panel,body.teaching #keys,body.teaching #top{display:none}
@media(max-width:900px){.t-probe{display:none}.t-bar{right:16px}}@media(max-width:700px){.t-card,.t-list{width:auto;right:16px}.t-list{display:none}.t-card{max-height:34vh}.t-bar{left:16px}}
body.bare #panel,body.bare #keys,body.bare #top{display:none}

// ---- random numbers: a stream per pixel and frame, the same every run

/** blue noise over the screen, stepped through the frames by the golden ratio: neighbours differ, and so do frames */
fn blue2(p: vec2u, k: u32) -> vec2f {

// ---- the sky: one function, one image (its mips are the blur)

// ================================================================ rays
struct Hit { t: f32, piece: u32, code: u32, thru: vec3f, gt: f32, gpiece: u32, gcode: u32 };   // g = the nearest pane before it

const CODE_QUAD = 6u; const CODE_CUT = 15u;

/** one piece: the overlap of the stays its box, its quadric and its planes allow. Sets hT and hCode */
fn meet(k: u32, ro: vec3f, rd: vec3f, tmin: f32, tmax: f32, cut: f32) -> bool {

      let s = sqrt(disc); let t0 = (-B - s) / A; let t1 = (-B + s) / A;

    } else if (A < -1e-9) {                                          // along a taper: inside is outside the two roots, on the nappe that is really there
      if (disc > 0.0) {
        let s = sqrt(disc); let t0 = (-B + s) / A; let t1 = (-B - s) / A;    // (A < 0: t0 < t1)
        if (1.0 - 0.5 * q.w * (o.y + d.y * t0) > 0.0) { tf = min(tf, t0); } else { if (t1 > tn) { tn = t1; code = CODE_QUAD; } }
      }
    } else if (abs(B) > 1e-9) { let t0 = -0.5 * C / B; if (B > 0.0) { tf = min(tf, t0); } else if (t0 > tn) { tn = t0; code = CODE_QUAD; } } else if (C > 0.0) { return false; }
  }

    let t = num / den; if (den < 0.0) { if (t > tn) { tn = t; code = 7u + i; } } else { tf = min(tf, t); }
  }

    if (abs(rd.y) > 1e-9) { let t = (cut - ro.y) / rd.y; if (rd.y < 0.0) { if (t > tn) { tn = t; code = CODE_CUT; } } else { tf = min(tf, t); } } else if (ro.y > cut) { return false; }
  }

}
fn boxHit(n: ptr<storage, Node, read>, ro: vec3f, inv: vec3f, tmin: f32, tmax: f32) -> bool {
  let a = ((*n).mn - ro) * inv; let b = ((*n).mx - ro) * inv; let mn = min(a, b); let mx = max(a, b);

}
fn octant(d: vec3f) -> u32 { return select(0u, 1u, d.x < 0.0) | select(0u, 2u, d.y < 0.0) | select(0u, 4u, d.z < 0.0); }
fn safeInv(d: vec3f) -> vec3f { return 1.0 / select(d, vec3f(1e-12), abs(d) < vec3f(1e-12)); }
/** how wide to how long: a leaf, a blade of grass, a twig */
fn leafWide(kind: u32) -> f32 { return select(select(0.46, 0.06, kind == 1u), 0.022, kind == 2u); }
/** a leaf: a pointed oval, seen from both sides */
fn meetLeaf(k: u32, ro: vec3f, rd: vec3f, tmin: f32, tmax: f32) -> f32 {
  let a = extra[k * 2u]; let b = bitcast<vec4u>(extra[k * 2u + 1u]);

  let x = ro + rd * t - a.xyz; let tl = octUnpack(b.y); let u = dot(x, tl) / a.w; let v = dot(x, cross(n, tl)) / a.w;
  let w = leafWide(b.w & 255u) * (1.0 - u * u) * (1.0 + 0.35 * u);
  return select(-1.0, t, abs(u) < 1.0 && abs(v) < w);
}

/** where a point is in the sun's map of the leaves: 0‥1, 0‥1, and how far along (1 = toward the sun) */
fn sunMap(x: vec3f) -> vec3f { let b = basis(frame.sunDir.xyz); let d = x - vec3f(4.0, 4.0, 0.0); return vec3f(dot(d, b[0]) / 30.0 + 0.5, dot(d, b[1]) / 30.0 + 0.5, dot(d, frame.sunDir.xyz) / 80.0 + 0.5); }

var<private> fineLeaves: bool = true; var<private> noLeaves: bool = false;
// (a ball's density is its own: half its leaves' area over its size, less for how they clump; with the instance's tint)
fn ballStay(o: vec3f, d: vec3f, tmin: f32, tmax: f32) -> vec2f { let a = dot(d, d); let b = dot(o, d); let c = dot(o, o) - 1.0; let q = b * b - a * c; if (q <= 0.0) { return vec2f(1.0, 0.0); } let s = sqrt(q); return vec2f(max((-b - s) / a, tmin), min((-b + s) / a, tmax)); }

var<private> walked: u32 = 0u;
fn nearest(ro: vec3f, rd: vec3f, tmin: f32, tmaxIn: f32, skip: u32, cut: f32) -> Hit {

  let t0 = select(tmin, max(tmin, (cut - ro.y) / rd.y), cut < 1e8 && ro.y > cut && rd.y < -1e-5);   // above the section nothing it cuts is there
  for (var s = 0u; s < 3u; s++) {
    let per = frame.per[s]; let b0 = frame.node0[s] + oc * frame.step[s]; let pb = frame.piece0[s]; let tm = select(t0, tmin, s == 1u);
    var i = 0u;
    while (i < per) {
      walked += 1u; let n = &nodes[b0 + i];
      if (!boxHit(n, ro, inv, tm, best)) { i = (*n).skip; continue; }
      let lf = (*n).leaf; let cnt = lf & 15u; let first = pb + (lf >> 4u);
      for (var j = 0u; j < cnt; j++) {
        let k = first + j; let fl = pieces[k].flags;
        if ((fl & skip) != 0u) { continue; }

          best = hT; id = k; code = hCode;
        }
      }
      i++;
    }
  }

    while (i < per) {
      walked += 1u; let n = &nodes[b0 + i];
      if (!boxHit(n, ro, inv, tmin, best)) { i = (*n).skip; continue; }
      let lf = (*n).leaf;

        let o = vec3f(dot((*I).r0.xyz, ro) + (*I).r0.w, dot((*I).r1.xyz, ro) + (*I).r1.w, dot((*I).r2.xyz, ro) + (*I).r2.w);

        let inv2 = safeInv(d); let q0 = (*I).node + octant(d) * (*I).per; var q = 0u; let qn = (*I).per;
        while (q < qn) {
          walked += 1u; let m = &nodes[q0 + q];
          if (!boxHit(m, o, inv2, tmin, best)) { q = (*m).skip; continue; }
          let l2 = (*m).leaf; let c2 = l2 & 15u;
          for (var j = 0u; j < c2; j++) { let w = (*I).leaf + (l2 >> 4u) + j; let t = meetLeaf(w, o, d, tmin, best); if (t > 0.0 && ro.y + rd.y * t < lc) { best = t; id = LEAF_HIT | k; code = w; } }

}
/** VISIBLE: how much gets through from ro along rd to tmax. Glass tints it, leaves let a little by */
fn visible(ro: vec3f, rd: vec3f, tmin: f32, tmax: f32) -> vec3f {
  var T = vec3f(1.0); let inv = safeInv(rd); let oc = octant(rd);
  for (var s = 0u; s < 3u; s++) {
    let per = frame.per[s]; let b0 = frame.node0[s] + oc * frame.step[s]; let pb = frame.piece0[s];
    var i = 0u;
    while (i < per) {
      let n = &nodes[b0 + i];
      if (!boxHit(n, ro, inv, tmin, tmax)) { i = (*n).skip; continue; }
      let lf = (*n).leaf; let cnt = lf & 15u; let first = pb + (lf >> 4u);
      for (var j = 0u; j < cnt; j++) {
        let k = first + j; let fl = pieces[k].flags;
        if ((fl & NOSHADOW) != 0u) { continue; }
        if (meet(k, ro, rd, tmin, tmax, 1e9)) {
          if ((fl & (GLASS | WATER)) != 0u) { T *= select(vec3f(0.62, 0.86, 0.9), unpackTint(pieces[k].tint), (fl & GLASS) != 0u); continue; }
          return vec3f(0.0);
        }
      }
      i++;
    }
  }
  if (!noLeaves) { let per = frame.per.w; let b0 = frame.node0.w + oc * frame.step.w; var i = 0u;
    while (i < per) {
      let n = &nodes[b0 + i];
      if (!boxHit(n, ro, inv, tmin, tmax)) { i = (*n).skip; continue; }
      let lf = (*n).leaf;
      if ((lf & 15u) != 0u) {
        let k = lf >> 4u; let I = &insts[k];
        let o = vec3f(dot((*I).r0.xyz, ro) + (*I).r0.w, dot((*I).r1.xyz, ro) + (*I).r1.w, dot((*I).r2.xyz, ro) + (*I).r2.w);
        let d = vec3f(dot((*I).r0.xyz, rd), dot((*I).r1.xyz, rd), dot((*I).r2.xyz, rd));
        if (!fineLeaves) { let tuft = ((*I).tint & 0x2000000u) != 0u; let sigma = f32((*I).tint >> 26u) / 16.0 * frame.misc2.z; let bd = select(d, d / 0.85, tuft); let st = ballStay(select(o, (o - vec3f(0.0, 0.8, 0.0)) / 0.85, tuft), bd, tmin, tmax); if (st.y > st.x) { T *= exp(-vec3f(1.0, 0.86, 1.1) * sigma * (st.y - st.x) * length(bd)); if (T.y < 0.02) { return vec3f(0.0); } } i++; continue; }
        let inv2 = safeInv(d); let q0 = (*I).node + octant(d) * (*I).per; var q = 0u; let qn = (*I).per;
        while (q < qn) {
          walked += 1u; let m = &nodes[q0 + q];
          if (!boxHit(m, o, inv2, tmin, tmax)) { q = (*m).skip; continue; }
          let l2 = (*m).leaf; let c2 = l2 & 15u;
          for (var j = 0u; j < c2; j++) { if (meetLeaf((*I).leaf + (l2 >> 4u) + j, o, d, tmin, tmax) > 0.0) { T *= vec3f(0.1, 0.16, 0.03); if (T.y < 0.02) { return vec3f(0.0); } } }
          q++;
        }
      }
      i++;
    } }
  if (frame.misc2.x > 0.5) { T *= smokeThrough(ro + rd * tmin, rd, tmax); }
  return T;
}

// ================================================================ smoke
const SM_AT = vec3f(-24.0, -0.16, -19.2); const SM_SIZE = vec3f(48.0, 15.36, 38.4); const SM_BRICK = 0.64;
fn smokeSlot(x: vec3f) -> u32 { let c = vec3i(floor((x - SM_AT) / SM_BRICK)); if (any(c < vec3i(0)) || any(c >= vec3i(75, 24, 60))) { return 0u; } return textureLoad(smokePage, c, 0).x; }
fn smokeBlock(x: vec3f) -> bool { return smokeSlot(x) != 0u; }
fn smokeIn(p: u32, x: vec3f) -> vec4f { let s = p - 1u; let l = fract((x - SM_AT) / SM_BRICK) * 8.0; return textureSampleLevel(smokeTex, linSamp, (vec3f(f32(s & 15u), f32((s >> 4u) & 15u), f32(s >> 8u)) * 10.0 + 1.0 + l) / vec3f(160.0, 160.0, 120.0), 0.0); }
fn smokeAt(x: vec3f) -> vec4f { let p = smokeSlot(x); if (p == 0u) { return vec4f(0.0); } return smokeIn(p, x); }
/** where a ray is in the grid */
fn smokeSpan(ro: vec3f, rd: vec3f, t1: f32) -> vec2f { let inv = safeInv(rd); let a = (SM_AT - ro) * inv; let b = (SM_AT + SM_SIZE - ro) * inv; return vec2f(max(max3(min(a, b)), 0.0), min(min3(max(a, b)), t1)); }

fn smokeSeen(ro: vec3f, rd: vec3f, t1: f32) -> vec4f {

  for (var i = 0u; i < 6u; i++) { let x = ro + rd * (s.x + dt * (f32(i) + 0.5)); let p = smokeSlot(x); if (p == 0u) { continue; } let v = smokeIn(p, x); let e = exp(-v.w * dt); L += select(v.rgb, vec3f(0.0), max3(v.rgb) > 24.0) * (T * (1.0 - e)); T *= e; } /* (a flame lights by its lamp: rays that are blurred see only its smoke) */ return vec4f(L, T);
}
fn smokeThrough(ro: vec3f, rd: vec3f, t1: f32) -> f32 {
  if (frame.misc2.x < 0.5) { return 1.0; } let s = smokeSpan(ro, rd, t1); if (s.y <= s.x) { return 1.0; } let dt = (s.y - s.x) / 8.0; var a = 0.0; for (var i = 0u; i < 8u; i++) { let x = ro + rd * (s.x + dt * (f32(i) + 0.5)); let p = smokeSlot(x); if (p != 0u) { a += smokeIn(p, x).w; } } return exp(-a * dt);
}
/** the camera's ray through a point of the picture (0‥1, y down) */
fn camRay(uv: vec2f) -> vec3f { let p = uv * 2.0 - 1.0; return normalize(frame.camFwd.xyz + frame.camRight.xyz * p.x - frame.camUp.xyz * p.y); }
/** where a world point is in the picture, now or last frame (z = its distance along the view; <= 0 behind) */
fn project(x: vec3f) -> vec3f { let v = x - frame.camPos.xyz; let z = dot(v, frame.camFwd.xyz); let r = frame.camRight.xyz; let u = frame.camUp.xyz; return vec3f(dot(v, r) / dot(r, r) / z * 0.5 + 0.5, 0.5 - dot(v, u) / dot(u, u) / z * 0.5, z); }

`;var pa=`// What is at a hit: its point, its normals, its material. Detail fades with the footprint \`fp\` (metres), so a bounce ray reads each material's mean.
struct Surf { x: vec3f, ng: vec3f, n: vec3f, albedo: vec3f, rough: f32, metal: f32, f0: f32, glow: vec3f, through: vec3f, kind: u32, piece: u32, flags: u32, ao: vec2f };

fn vnoise(p: vec2f) -> f32 { let i = floor(p); let f = p - i; let w = f * f * f * (f * (f * 6.0 - 15.0) + 10.0); return mix(mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), w.x), mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), w.x), w.y); }

fn gridLine(p: vec2f, cell: vec2f) -> f32 { let q = abs(fract(p / cell + 0.5) - 0.5) * cell; return min(q.x, q.y); }

nt, no relief. A spray of leaves is a ball of fog that a ray steps into by chance.",why:"A bounce is blurred over half the sky anyway, so it is asked of a simpler world. The boxes a ray looks at are its cost.",looks:[{name:"Its world",note:"mean colors, trees as fog",code:"fineLeaves = false; rngInit(p, 77u); let h = nearest(frame.camPos.xyz, pxRay(q), 1e-3, 2000.0, 0u, frame.misc.y); if (h.piece == NOTHING) { return vec3f(0.02); } return surfaceMean(frame.camPos.xyz, pxRay(q), h).albedo;"},{name:"Its facing",code:"fineLeaves = false; rngInit(p, 77u); let h = nearest(frame.camPos.xyz, pxRay(q), 1e-3, 2000.0, 0u, frame.misc.y); if (h.piece == NOTHING) { return vec3f(0.02); } return pow(surfaceMean(frame.camPos.xyz, pxRay(q), h).ng * 0.5 + 0.5, vec3f(2.2));"},{name:"What it brings back",note:"this is what one bounce ray returns",cache:!0,code:"fineLeaves = false; rngInit(p, 77u); let rd = pxRay(q); let h = nearest(frame.camPos.xyz, rd, 1e-3, 2000.0, 0u, frame.misc.y); if (h.piece == NOTHING) { return asSeen(skyLod(rd, 3.0)); } let m = surfaceMean(frame.camPos.xyz, rd, h); return asSeen(m.glow + sentBack(m, (h.piece & LEAF_HIT) != 0u, rnd2(), rd));"},{name:"Boxes it looked at",note:"coarse; blue few, yellow 160",code:"fineLeaves = false; rngInit(p, 77u); walked = 0u; let h = nearest(frame.camPos.xyz, pxRay(q), 1e-3, 2000.0, 0u, frame.misc.y); return heat(f32(walked) / 160.0 + f32(h.piece & 1u) * 1e-6);"},{name:"and with every leaf",note:"the same, if leaves were asked one by one",code:"fineLeaves = true; walked = 0u; let h = nearest(frame.camPos.xyz, pxRay(q), 1e-3, 2000.0, 0u, frame.misc.y); return heat(f32(walked) / 160.0 + f32(h.piece & 1u) * 1e-6);"}]},{group:"See",title:"What the light table holds",stages:["cache"],sig:"slots : hash(cell, facing, level) → { E, sun, samples }",what:"The same table as step 4, taken apart. A fine level at a third of a metre, a coarse one at 1.35 m under it (6 m in the city), one entry a cell for leaves. A lookup tries fine, then coarse.",why:"It is a hash table, so it costs what it holds, not how big the world is. What nobody looked at is not in it.",looks:["0u","1u"].map((a,s)=>({name:s?"Coarse level":"Fine level",note:"magenta: nothing there",reads:$e,cache:!0,code:`${Ke} if (s.sky) { return vec3f(0.02); } let n = select(s.ng, vec3f(0.0), s.leaf); let k = cacheFind(cacheKey(s.x, n, ${a})); if (k == NOTHING) { return vec3f(0.25, 0.0, 0.2); } let c = cells[2u * k]; let d = cells[2u * k + 1u]; return asWall(c.xyz + frame.sunE.xyz * max(dot(s.ng, frame.sunDir.xyz), 0.0) * d.w);`})).concat([{name:"Which level answers",note:"green fine, orange coarse, magenta none",reads:$e,cache:!0,code:`${Ke} if (s.sky) { return vec3f(0.02); } let n = select(s.ng, vec3f(0.0), s.leaf); let a = cacheFind(cacheKey(s.x, n, 0u)); let b = cacheFind(cacheKey(s.x, n, 1u)); if (a != NOTHING && cells[2u * a].w >= 3.0) { return vec3f(0.05, 0.4, 0.12); } if (b != NOTHING && cells[2u * b].w > 0.0) { return vec3f(0.6, 0.22, 0.02); } return vec3f(0.35, 0.0, 0.28);`},{name:"The slots themselves",note:"all 262,144 in order, 640 a row: brightness = samples, color = which way it faces",cache:!0,code:"let w = 640u; let i = u32(uv.y * 410.0) * w + u32(uv.x * f32(w)); if (i >= SLOTS) { return vec3f(0.0); } if (atomicLoad(&keys[i]) == 0u) { return vec3f(0.012); } let a = cells[2u * i].w; return hue(facing(octUnpack(cells_n(i))) * 7919u + 3u) * (0.15 + 0.85 * clamp(a / 96.0, 0.0, 1.0));"},{name:"Its light, slot by slot",cache:!0,code:"let w = 640u; let i = u32(uv.y * 410.0) * w + u32(uv.x * f32(w)); if (i >= SLOTS || atomicLoad(&keys[i]) == 0u) { return vec3f(0.0); } return asWall(cells[2u * i].xyz);"}])},{group:"Check",title:"Against the reference",stages:[],sig:"reference : World × Camera → Picture (paths to the end, no cache, no filter)",what:"The same world, traced plainly: one path a pixel a frame, followed until it dies, summed for as long as you look. Nothing is kept, reused, clamped or blurred.",why:"This is what every step above is trying to say sooner. Red is where real time is too bright, blue too dark, a full color a whole stop.",looks:[{name:"Reference",signal:"hdr",picture:!0,ref:!0,note:"settles as you wait"},{name:"Difference",ref:!0,reads:{picture:"t0",hdr:"t1"},code:"var a = 0.0; var b = 0.0; let d = vec2i(textureDimensions(t0)) - 1; for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) { let k = clamp(vec2i(p) + vec2i(x, y), vec2i(0), d); a += lum(textureLoad(t0, k, 0).rgb); b += lum(textureLoad(t1, k, 0).rgb); } } let r = log2((a + 1e-3) / (b + 1e-3)); return vec3f(max(r, 0.0), 0.0, max(-r, 0.0)) + 0.004;"},{name:"Real time",picture:!0,ref:!0}],probe:["picture","paths"]}]}var vn=`
fn heat(x: f32) -> vec3f { let t = clamp(x, 0.0, 1.0); return pow(clamp(vec3f(1.6 * t - 0.25, 1.5 * t - 0.28 * t * t - 0.12, 0.45 + 0.9 * t - 2.1 * t * t + 0.55 * t * t * t), vec3f(0.01), vec3f(1.0)), vec3f(1.8)); }
fn hue(k: u32) -> vec3f { let h = pcg(k); let a = f32(h & 1023u) / 1023.0; let c = clamp(abs(fract(a + vec3f(0.0, 0.667, 0.333)) * 6.0 - 3.0) - 1.0, vec3f(0.0), vec3f(1.0)); return mix(vec3f(0.5), c, 0.55) * (0.25 + 0.55 * f32((h >> 10u) & 255u) / 255.0); }
/** light, by one exposure and the curve */
fn asSeen(c: vec3f) -> vec3f { return shown(max(c, vec3f(0.0)) * exp2(-2.1 - 0.9 * e[0])); }
