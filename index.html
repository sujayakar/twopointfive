<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>twopointsix — 2.5D RT stealth sandbox</title>
  <style>
    /* THE FIGHT SCREEN WEARS THE MENUS' LOOK (src/ui/theme.ts): sand ink on warm black and the ONE orange, which here marks what leads on: the row a tap of Space does,
       the objective, a lost man's way. Every other hue still means something (gold / red / blue = who an order goes to; amber then red = alarm; blue = a door; red = a man).
       Each token is the menus' own (`--m-…`, in the page from the first script on); the literal after it is that token's value for the moments before, and
       `tools/qa/hud-look-check.ts` is red when one drifts from theme.ts, or when a green comes back into these rules. Labels are the menus' condensed caps, rows their
       plain sans, digits and keys mono. A mark that sits on the picture keeps a dark halo (`--h-shadow`): sand has no hue to stand off a sunlit floor with. */
    :root {
      --h-ink: var(--m-text, #d2c9b5); --h-hi: var(--m-bright, #f0e9d9); --h-hi-rgb: var(--m-bright-rgb, 240,233,217); --h-soft: var(--m-soft, #a0977f); --h-dim: var(--m-dim, #938b76); --h-faint: var(--m-faint, #857d69);
      --h-edge: var(--m-edge, 214,200,170); --h-acc: var(--m-accent, #f0912e); --h-acc-hi: var(--m-accent-hi, #ffb561); --h-acc-rgb: var(--m-accent-rgb, 240,145,46); --h-on: var(--m-on-accent, #140d05);
      --h-base: var(--m-base, #0c0b09); --h-plate: var(--m-base-rgb, 12,11,9); --h-field: rgb(var(--m-panel-rgb, 21,19,16)); --h-btn: var(--m-btn-rgb, 44,40,33); --h-hover: var(--m-hover-rgb, 66,60,50);
      --h-font: var(--m-font, Inter, ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif);
      --h-head: var(--m-head, 'Avenir Next Condensed', 'DIN Condensed', 'Roboto Condensed', 'Arial Narrow', Inter, ui-sans-serif, system-ui, sans-serif);
      --h-mono: var(--m-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
      --h-shadow: 0 1px 2px #000, 0 0 5px rgba(0,0,0,0.7);
    }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--h-mono); color: var(--h-ink); }
    #app { position: fixed; inset: 0; }
    canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; image-rendering: auto; }
    /* left column, top: the debug read-out (#hud — main.ts fills it every 10 frames, empties it while the tour runs) and the interaction panel, which sits to the
       right of that block while it has text and at the screen edge when it is empty (:empty drops it out of the row). The read-out is clipped short of the kit stack. */
    #lcol { position: absolute; left: 10px; top: 8px; display: flex; align-items: flex-start; gap: 16px; pointer-events: none; }
    #hud { font: 11px/1.35 var(--h-mono); white-space: pre; color: var(--h-ink); text-shadow: var(--h-shadow); max-height: calc(100vh / var(--tz, 1) - 240px); overflow: hidden; }   /* controls live in the pause / start card now */
    #hud:empty { display: none; }
    #hud:not(:empty) { min-width: 330px; }   /* a steady left edge for the panel beside it while the numbers change */
    /* interaction panel (overlay.ts setInteractions): what Space can do round here — one block per VERB (a shut door is 'push it open' and 'ease it open';
       the man in the arm 'question him' and 'choke him out'), a thin bar for a lock being picked / the drive coming out / a leaf easing round; the highlighted row
       (a tap does it; Space held opens the list to choose another) is lit. The same sand caps and rows as the meters / objective line, the kit slots' translucent backing. */
    #interact { display: none; width: 290px; margin: 46px 0 0 8px; font: 11px/1.3 var(--h-font); letter-spacing: 0.01em; color: var(--h-ink); text-shadow: var(--h-shadow); opacity: 0.95; }
    #interact.on { display: block; }
    #hud:not(:empty) + #interact { margin-left: 0; }
    #interact .it { position: relative; margin-bottom: 4px; padding: 4px 8px 5px 10px; background: rgba(var(--h-plate),0.6); border: 1px solid rgba(var(--h-edge),0.22); border-radius: 3px; }
    @media (max-height: 620px) { #interact { margin-top: 30px; } #interact .it { margin-bottom: 2px; padding: 2px 8px 3px 10px; } }   /* a short window: the open order menu clears the kit column under it */
    #interact .it.primary { border-color: rgba(var(--h-edge),0.7); box-shadow: 0 0 8px rgba(0,0,0,0.4); background: rgba(var(--h-plate),0.72); }
    #interact .it.primary::before { content: ''; position: absolute; left: -1px; top: -1px; bottom: -1px; width: 2px; background: var(--h-acc); border-radius: 2px 0 0 2px; }
    #interact .what { display: flex; justify-content: space-between; gap: 8px; font: 700 11px/1 var(--h-head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--h-hi); white-space: nowrap; }
    #interact .what span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    #interact .what em { flex: none; font: 400 10px/1.2 var(--h-font); letter-spacing: 0.02em; text-transform: none; color: var(--h-dim); }
    #interact .it.k-door .what { color: #b4d8ff; } #interact .it.k-body .what { color: #f0b8a8; } #interact .it.k-guard .what { color: #ff9a8a; } #interact .it.k-objective .what { color: var(--h-hi); } #interact .it.k-breaker .what { color: #ffd08a; }
    #interact .it.off .what { color: #f0b888; }
    /* the squad's elements (orders.ts Tone): gold = the whole squad, red / blue = a pair or a man of it — the row's header, or one line of it */
    #interact .it.t-gold .what, #interact .t-gold.opt, #interact .t-gold.hint { color: #f2cf6b; } #interact .it.t-red .what, #interact .t-red.opt, #interact .t-red.hint { color: #ff9a8a; } #interact .it.t-blue .what, #interact .t-blue.opt, #interact .t-blue.hint { color: #9cc8ff; }
    #interact .opt, #interact .hint { margin-top: 3px; white-space: normal; overflow-wrap: anywhere; letter-spacing: 0.01em; }   /* a long row WRAPS (it was cut with an ellipsis: 'cover this door — no line fro…' lost the one thing a greyed order has to say) */
    #interact .opt:has(kbd) { display: flex; align-items: baseline; } #interact .opt kbd { flex: none; }   /* … and hangs under its own words, not under its key (whatever the key cap's width: 1, SPACE, LMB) */
    #interact .opt { font-size: 12px; line-height: 1.2; color: var(--h-hi); }
    #interact .hint { color: var(--h-soft); }
    #interact .hint.lost s { opacity: 0.6; } #interact .hint.lost b { display: inline-block; color: var(--h-acc); margin-left: 7px; font-weight: 700; } #interact .hint.lost b.n { animation: lostin 0.5s ease-out; } @keyframes lostin { from { scale: 2.2; opacity: 0; } }   /* a squad man lost: his line struck, the way it came from */
    #interact kbd { display: inline-block; min-width: 9px; margin-right: 7px; padding: 1px 4px 0; border-radius: 2px; background: rgba(var(--h-edge),0.8); color: var(--h-on); font: 700 9px/1.25 var(--h-mono); letter-spacing: 0.06em; text-align: center; text-shadow: none; vertical-align: 1px; }
    #interact .it.primary > .what + .opt kbd { background: var(--h-acc); } #interact .it.primary.far > .what + .opt kbd { background: var(--h-faint); }
    #interact .it.far .opt { color: var(--h-dim); } #interact .it.far kbd { background: var(--h-faint); color: var(--h-on); }
    /* the selector (interact.ts): every row is one verb — SPACE lit only on the highlighted one (a tap does it), the others' key dimmed until the highlight reaches
       them (Space held opens the list: wheel / arrows choose, let go acts); rows of the same thing tuck under its header; open, the frame brightens, a line at the
       top says how it works and the cancel row closes the list */
    #interact .it:not(.primary) .opt.verb kbd { background: rgba(var(--h-edge),0.22); color: var(--h-soft); }
    #interact .it.cont { margin-top: -3px; border-top-color: transparent; border-top-left-radius: 0; border-top-right-radius: 0; padding-top: 1px; }
    #interact .it.cont .what { height: 0; }
    #interact .it.cont .what em:empty { display: none; }
    #interact.open .it { border-color: rgba(var(--h-edge),0.4); }
    #interact.open .it.primary { border-color: var(--h-hi); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    #interact.open .it.primary::before { width: 3px; background: var(--h-acc-hi); }
    #interact .selhint { margin: 0 0 5px 2px; font: 600 10px/1.3 var(--h-head); letter-spacing: 0.14em; text-transform: uppercase; color: var(--h-soft); }
    #interact .it.k-cancel { padding-top: 3px; padding-bottom: 4px; background: rgba(var(--h-plate),0.6); border-color: rgba(var(--h-edge),0.3); }
    #interact .it.k-cancel .opt { margin-top: 0; color: var(--h-soft); } #interact .it.k-cancel kbd { background: rgba(var(--h-edge),0.3); color: var(--h-hi); }
    #interact .it.k-cancel.primary { border-color: var(--h-hi); box-shadow: 0 0 10px rgba(0,0,0,0.4); } #interact .it.k-cancel.primary::before { background: var(--h-hi); box-shadow: 0 0 6px rgba(0,0,0,0.5); } #interact .it.k-cancel.primary kbd { background: var(--h-hi); color: var(--h-on); }
    #interact.corner { width: 230px; } #interact .it.one { margin-bottom: 3px; padding: 3px 8px 4px 8px; } #interact .it.one .opt, #interact .it.one .hint { margin-top: 0; } #interact .it.one .hint + .hint, #interact .it.one .opt + .hint { margin-top: 3px; }   /* the corner as three things (ui/corner.ts, HANDRING.corner): a block under no heading … */
    #interact .it.one.primary kbd { background: var(--h-acc); } #interact .it.one.primary.far kbd { background: var(--h-faint); } #interact .it.one.off .opt { color: var(--h-faint); } #interact .it.one.off kbd { background: var(--h-faint); }   /* … its lit line's key as a row's was, a line that cannot be given now faint */
    #interact .it.sec { margin-bottom: 6px; border-color: rgba(var(--h-edge),0.55); } #interact .it.sec .what { color: var(--h-acc); } #interact .it.sec .opt { color: var(--h-ink); } #interact .it.sec .what + .opt { margin-top: 3px; } #interact .it.sec > .opt:first-child { margin-top: 0; } #interact .it.sec.done .opt { color: var(--h-hi); } #interact .it.sec.failed .opt { color: #f0a090; }   /* … under the objective's section (the stage's colours as the top line had them) */
    #interact .prog { margin-top: 5px; height: 3px; border: 1px solid rgba(var(--h-edge),0.45); background: rgba(var(--h-plate),0.5); }
    #interact .prog b { display: block; width: 0; height: 100%; background: var(--h-ink); }
    #interact .it.k-door .prog b { background: #bfe6ff; }
    #interact .more { padding: 0 10px; font-size: 9px; letter-spacing: 0.14em; color: var(--h-dim); }
    /* the tour empties #hud, so the panel is at the edge: start it under the letterbox bar; on a window too narrow for it to sit beside the centred caption card, under that too */
    body.touring #interact { margin-top: calc(7.5vh / var(--tz, 1) + 4px); }
    @media (max-width: 1340px) { body.touring #interact { margin-top: calc(7.5vh / var(--tz, 1) + 190px); } }
    /* THE TWEAK PANEL (Tab; ui/panel.ts + bindings.ts): a two-level tool — SYSTEMS down a left rail, collapsible SECTIONS on the selected system's page — in the HUD's own
       thin sand mono. Header: a status strip (preset · resolution · fps · gpu ∪, so it is worth having up with the read-out off), the search box (every system at once;
       hover the panel and type, ← / → or [ / ] walk the rail) and the 'all knobs' switch that reveals the A/B rows (.row.adv) and the rarely-touched sections (.advsec). */
    #panel { position: absolute; right: 8px; top: 8px; width: 372px; max-height: calc(100% - 16px); overflow: hidden; z-index: 12; display: flex; flex-direction: column; font: 11px/1.3 var(--h-mono); color: var(--h-ink); background: rgba(var(--h-plate),0.94); border: 1px solid rgba(var(--h-edge),0.22); border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    #panel.hidden { display: none; }
    #panel .phead { flex: none; padding: 6px 8px 5px; border-bottom: 1px solid rgba(var(--h-edge),0.16); background: rgba(var(--h-plate),0.6); }
    #panel .pstat { font-size: 10px; letter-spacing: 0.06em; color: var(--h-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; margin-bottom: 5px; text-shadow: 0 1px 2px #000; }
    #panel .pstat:empty { display: none; }
    #panel .psearch { display: flex; align-items: center; gap: 8px; }
    #panel .psearch input[type=search] { flex: 1; min-width: 0; font: inherit; background: var(--h-field); color: var(--h-hi); border: 1px solid rgba(var(--h-edge),0.2); border-radius: 3px; padding: 3px 7px; outline: none; }
    #panel .psearch input[type=search]::placeholder { color: var(--h-faint); }
    #panel .psearch input[type=search]:focus { border-color: var(--h-acc); box-shadow: 0 0 0 1px rgba(var(--h-acc-rgb),0.25); }
    #panel .psearch .all { color: var(--h-dim); white-space: nowrap; display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 10px; letter-spacing: 0.06em; }
    #panel .phits { font-size: 10px; color: #f3c86a; letter-spacing: 0.04em; margin-top: 4px; }
    #panel .phits:empty { display: none; }
    #panel .pmain { flex: 1 1 auto; min-height: 0; display: flex; }
    /* the rail: one button per system — a glyph and a short label; the active one carries the orange bar; dimmed = nothing on that page until 'all knobs'; a search lights the systems it hit */
    #panel .prail { flex: 0 0 48px; display: flex; flex-direction: column; gap: 1px; padding: 4px 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; border-right: 1px solid rgba(var(--h-edge),0.14); background: rgba(var(--h-plate),0.5); }
    #panel .prail::-webkit-scrollbar { display: none; }
    #panel .prail .sys { all: unset; box-sizing: border-box; width: 100%; padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; color: var(--h-faint); border-left: 2px solid transparent; }
    #panel .prail .sys i { font: normal 13px/1 var(--h-mono); }
    #panel .prail .sys span { font-size: 7.5px; letter-spacing: 0.08em; text-transform: uppercase; max-width: 44px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #panel .prail .sys:hover { color: var(--h-ink); background: rgba(var(--h-edge),0.08); }
    #panel .prail .sys.on { color: var(--h-hi); border-left-color: var(--h-acc); background: rgba(var(--h-acc-rgb),0.1); text-shadow: none; }
    #panel .prail .sys.dim:not(.on) { opacity: 0.45; }
    #panel.searching .prail .sys { opacity: 0.35; } #panel.searching .prail .sys.hit { opacity: 1; color: #f3d78a; }
    #panel .pbody { flex: 1 1 auto; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 10px; scrollbar-width: thin; scrollbar-color: rgba(var(--h-edge),0.2) transparent; }
    #panel .ptitle { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--h-ink); padding: 7px 2px 3px; text-shadow: none; }
    #panel .ptitle span { display: block; margin-top: 2px; font-size: 9.5px; letter-spacing: 0.03em; text-transform: none; color: var(--h-faint); text-shadow: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel .pempty { margin: 10px 2px; font-size: 10px; color: var(--h-dim); font-style: italic; }
    /* a section: header = caret · NAME · live one-line summary (shown while collapsed) · ↺ (where a shipped-defaults table exists) */
    #panel .psec { border-top: 1px solid rgba(var(--h-edge),0.12); }
    #panel .psec:first-of-type { border-top: none; }
    #panel h3.pshead { display: flex; align-items: baseline; gap: 6px; margin: 0; padding: 6px 2px 5px; font: inherit; font-weight: 400; cursor: pointer; user-select: none; }
    #panel h3.pshead:hover { background: rgba(var(--h-edge),0.06); }
    #panel .pshead .caret { flex: 0 0 9px; color: rgba(var(--h-edge),0.4); font-weight: 400; font-size: 9px; }
    #panel .pshead .nm { flex: 0 1 auto; min-width: 0; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--h-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel .pshead.open .nm { color: var(--h-hi); }
    #panel.searching .pshead .nm { color: #f3d78a; letter-spacing: 0.04em; }
    #panel .pshead .sum { flex: 1 1 0; min-width: 0; text-align: right; font-size: 9.5px; color: var(--h-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel .psec.open > .pshead .sum { opacity: 0.55; }
    #panel .pshead .rst { all: unset; flex: none; cursor: pointer; color: var(--h-faint); font-size: 11px; padding: 0 3px; border-radius: 2px; }
    #panel .pshead .rst:hover { color: #f0d878; background: rgba(240,216,120,0.1); }
    #panel .psec.advsec > .pshead .nm::after { content: ' · A/B'; color: var(--h-faint); font-weight: 400; letter-spacing: 0.04em; }
    #panel .sbody { padding: 1px 0 6px 4px; }
    /* rows: label left (ellipsis, full text in the tooltip), the control right; a thin track, a compact switch, tabular read-outs; A/B rows a shade dimmer with a dotted mark */
    #panel .row { display: flex; align-items: center; gap: 6px; min-height: 18px; margin: 1px 0; padding: 1px 2px; border-radius: 2px; }
    #panel .row:hover { background: rgba(var(--h-edge),0.05); }
    #panel .row label { flex: 1 1 auto; min-width: 0; color: var(--h-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #panel .row.adv label { color: var(--h-soft); } #panel .row.adv label::before { content: '· '; color: rgba(var(--h-edge),0.4); }
    #panel .row.changed label { color: #f0d878; }
    #panel .row.flash { animation: pflash 1.4s ease-out; } @keyframes pflash { 0%, 30% { background: rgba(240,216,120,0.28); } 100% { background: transparent; } }
    #panel .row .val { flex: 0 0 40px; text-align: right; color: var(--h-hi); font-variant-numeric: tabular-nums; font-size: 10.5px; }
    #panel .row .rev { flex: 0 0 9px; color: #f0d878; cursor: pointer; font-size: 7px; text-align: center; visibility: hidden; }
    #panel .row input[type=range] { flex: 0 0 96px; min-width: 0; height: 14px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
    #panel .row input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(var(--h-edge),0.2); border-radius: 1px; }
    #panel .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 9px; height: 9px; margin-top: -3.5px; border-radius: 50%; background: var(--h-hi); box-shadow: 0 0 5px rgba(0,0,0,0.5); border: none; }
    #panel .row input[type=range]::-moz-range-track { height: 2px; background: rgba(var(--h-edge),0.2); } #panel .row input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: var(--h-hi); border: none; }
    #panel .row input[type=range]:focus { outline: none; } #panel .row input[type=range]:focus::-webkit-slider-thumb { box-shadow: 0 0 0 2px rgba(var(--h-acc-rgb),0.35); }
    #panel .row.changed input[type=range]::-webkit-slider-thumb { background: #f0d878; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
    /* the switch: a pill with its knob drawn as a background gradient (no pseudo-element — __panelShot's DOM raster keeps backgrounds, loses ::before) */
    #panel .row input[type=checkbox] { -webkit-appearance: none; appearance: none; flex: 0 0 24px; width: 24px; height: 13px; margin: 0 1px 0 0; border-radius: 7px; border: 1px solid rgba(var(--h-edge),0.26); cursor: pointer; background: var(--h-field) radial-gradient(circle at 5.5px 50%, var(--h-faint) 0 4px, transparent 4.6px) no-repeat; transition: border-color .12s; }
    #panel .row input[type=checkbox]:checked { border-color: rgba(var(--h-acc-rgb),0.8); background: rgba(var(--h-acc-rgb),0.22) radial-gradient(circle at 16.5px 50%, var(--h-acc) 0 4px, rgba(var(--h-acc-rgb),0.35) 4.3px, transparent 6px) no-repeat; }
    #panel .row input[type=checkbox]:hover { border-color: var(--h-faint); } #panel .row input[type=checkbox]:checked:hover { border-color: var(--h-acc-hi); }
    #panel .row input[type=checkbox]:focus-visible { outline: 1px solid var(--h-acc); outline-offset: 1px; }
    #panel.rastering .row input[type=range] { -webkit-appearance: auto; appearance: auto; accent-color: var(--h-acc); height: 12px; }   /* (__panelShot only: the custom track / thumb are pseudo-elements the DOM raster cannot carry — a capture shows the native slider in the panel's orange instead) */
    #panel .psearch input[type=checkbox] { accent-color: var(--h-acc); margin: 0; }
    #panel .row select { flex: 0 1 auto; min-width: 0; max-width: 62%; font: inherit; font-size: 10.5px; background: var(--h-field); color: var(--h-hi); border: 1px solid rgba(var(--h-edge),0.2); border-radius: 3px; padding: 1px 3px; outline: none; }
    #panel .row select:focus { border-color: var(--h-acc); }
    #panel .row.btnrow { align-items: baseline; flex-wrap: wrap; row-gap: 3px; }
    #panel .row.btnrow label { flex: 0 0 auto; max-width: 40%; color: var(--h-dim); font-size: 10px; letter-spacing: 0.04em; }
    #panel .row.btnrow label:empty { display: none; }
    #panel .row .btns { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; }
    #panel .row button { font: inherit; font-size: 10px; letter-spacing: 0.03em; background: rgba(var(--h-btn),0.7); color: var(--h-ink); border: 1px solid rgba(var(--h-edge),0.32); border-radius: 3px; padding: 1px 6px 2px; cursor: pointer; white-space: nowrap; }
    #panel .row button:hover { background: rgba(var(--h-hover),0.85); border-color: var(--h-ink); color: var(--h-hi); }
    #panel .row button:active { background: var(--h-acc); color: var(--h-on); }
    #panel .row.textrow { display: block; min-height: 0; margin: 3px 0 4px 1px; padding: 3px 6px 3px 7px; border-left: 2px solid rgba(var(--h-edge),0.22); background: rgba(var(--h-plate),0.3); font-size: 10px; line-height: 1.35; color: var(--h-soft) !important; white-space: pre-wrap; word-break: break-word; }
    #panel .row.textrow.empty { display: none; }
    /* the panel's own hover tip (ui/panel.ts installTips): descriptions and whatever an ellipsis above cut short, wrapped, at once */
    #ptip { position: fixed; z-index: 40; max-width: 356px; padding: 5px 8px 6px; font: 10.5px/1.4 var(--h-mono); color: var(--h-ink); background: rgba(var(--h-plate),0.97); border: 1px solid rgba(var(--h-edge),0.38); border-radius: 3px; box-shadow: 0 6px 22px rgba(0,0,0,0.6); pointer-events: none; white-space: pre-wrap; word-break: break-word; letter-spacing: 0.02em; }
    #panel .row input.num { width: 7ch; background: var(--h-field); color: var(--h-hi); border: 1px solid rgba(var(--h-edge),0.2); border-radius: 3px; padding: 1px 4px; text-align: right; cursor: ew-resize; outline: none; font: inherit; }
    #panel .row input.num:focus { cursor: text; border-color: var(--h-acc); }
    #fatal { position: absolute; inset: 0; display: none; z-index: 40; align-items: center; justify-content: center; text-align: center; padding: 40px; font-size: 14px; color: #fcc; background: #100; white-space: pre-wrap; }
    #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .marker { position: absolute; transform: translate(-50%, -100%); font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px #000, 0 0 6px #000; white-space: nowrap; }
    .marker.sus { color: #fd6; } .marker.alert { color: #f54; } .marker.dead { color: #777; font-weight: 400; font-size: 10px; } .marker.ko { color: var(--h-dim); font-weight: 400; font-size: 10px; letter-spacing: -0.05em; } .marker.calm { color: var(--h-soft); font-weight: 400; font-size: 10px; }
    .marker.frag { color: #ff5a3c; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; }   /* frag.ts fragMarks: a defender's live grenade Sam has been cued on, with the seconds left */
    .lostfrom { position: absolute; height: 3px; transform-origin: 0 50%; pointer-events: none; background: linear-gradient(90deg, rgba(var(--h-acc-rgb),0.35), var(--h-acc)); }   /* deathrecap.ts lostLive: the way the round came in at a squad man lost, on the ground at him */
    .lostfrom::after { content: ''; position: absolute; right: -2px; top: -3.5px; border-left: 9px solid var(--h-acc); border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    .marker.lastseen { color: #cbb98a; font-weight: 400; font-size: 12px; letter-spacing: 0.08em; }   /* fogofwar.ts lastSeen: '(?)' where an enemy was last seen, fading — thin and bracketed, never a live man's bold '?' */
    .marker.civ { font-style: italic; opacity: 0.9; } .marker.civ.alert { color: #f96; } .marker.civ.sus { color: #fe9; }   /* the civilians' (civilians.ts): the same glyphs, softer and slanted — a frightened cleaner is not a man onto you */
    /* the ring on the marker F acts on (what it offers is spelled out in the interaction panel, #interact); dimmer while the thing is out of reach */
    .reticle { position: absolute; width: 22px; height: 22px; border: 1.5px solid var(--h-hi); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 6px rgba(0,0,0,0.8); }
    .reticle.far { opacity: 0.55; }
    .reticle.aim { width: 16px; height: 16px; border-width: 1px; opacity: 0.7; box-shadow: none; pointer-events: none; }   /* the auto-aim snap ring: smaller and quieter than the interaction ring; under the aim model overlay.ts sizes it to the cone and brightens it as the aim settles */
    .reticle.aim.k-free { border-color: rgba(var(--h-hi-rgb),0.85); }   /* …round the bare cursor's point when nothing is near (aim model only) */
    .reticle.aim.trail { opacity: 0.55; }   /* aimweight.ts: the circle is where the gun points — quieter while it is still swinging onto the cursor */
    .reticle.aim.shut, .aimwish.gun.shut { border-style: dashed; opacity: 0.95 !important; }   /* player.ts gunShut: his gun cannot get a round out from here (a wall holds it down, or its muzzle is past a jamb) — the ring is broken and barred; while the ring is busy on a thing Space acts on, the gun's own small circle is */
    .reticle.aim.shut::after, .aimwish.gun.shut::after { content: ''; position: absolute; left: 50%; top: 50%; width: 2px; height: 130%; min-height: 20px; background: rgba(var(--h-hi-rgb),0.95); border-radius: 1px; transform: translate(-50%, -50%) rotate(45deg); box-shadow: 0 0 3px rgba(0,0,0,0.9); }
    .reticle.aim.k-guard.shut::after { background: #ff8070; }
    .aimwish { position: absolute; width: 5px; height: 5px; border-radius: 50%; transform: translate(-50%, -50%); background: #ffe9a8; opacity: 0.85; pointer-events: none; }   /* …and a dot on what the reticle snapped to (a light, a man) until it gets there */
    .aimwish.k-guard { background: #ff8070; }
    .aimwish.gun { width: 12px; height: 12px; background: none; border: 1px solid rgba(var(--h-hi-rgb),0.85); opacity: 0.55; }   /* …or the circle itself, small, while the ring is busy on something Space acts on */
    .reticle.off { border-color: #f96; box-shadow: 0 0 5px rgba(0,0,0,0.8); }
    .reticle.k-door { border-color: #9cd0ff; box-shadow: 0 0 5px rgba(0,0,0,0.8); } .reticle.k-body { border-color: #f0a090; box-shadow: 0 0 5px rgba(0,0,0,0.8); } .reticle.k-guard { border-color: #ff8070; box-shadow: 0 0 5px rgba(0,0,0,0.8); } .reticle.k-objective { border-color: var(--h-acc); box-shadow: 0 0 5px rgba(0,0,0,0.8); } .reticle.k-breaker { border-color: #ffd08a; box-shadow: 0 0 5px rgba(0,0,0,0.8); }
    /* progress ring round the reticle (a lock being picked, the drive coming out): a conic sweep masked to a 3 px annulus just outside the ring */
    .reticle b { display: none; position: absolute; inset: -7px; border-radius: 50%; pointer-events: none; background: conic-gradient(#bfe6ff var(--p, 0%), rgba(160,210,255,0.14) 0); -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px)); mask: radial-gradient(circle closest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px)); filter: drop-shadow(0 0 3px rgba(0,0,0,0.7)); }
    .reticle.k-objective b { background: conic-gradient(var(--h-acc-hi) var(--p, 0%), rgba(var(--h-acc-rgb),0.14) 0); }
    /* the one word beside the ring: the 40 mm's '40 MM · TOO CLOSE TO ARM' (overlay.ts HE40_SHORT; the plain 'RMB  OCP' / 'RMB  RING' words are gone) */
    .reticle i { display: none; position: absolute; left: 100%; top: 100%; margin: 1px 0 0 5px; font: 600 10px/1 var(--h-head); font-style: normal; letter-spacing: 0.12em; white-space: pre; color: var(--h-hi); text-shadow: 0 1px 2px #000, 0 0 5px rgba(0,0,0,0.5); pointer-events: none; }
    .reticle.k-light i { color: #ffe9a8; text-shadow: var(--h-shadow); }
    /* light / sound meters, bottom-left: two thin monochrome bars (Chaos-Theory-ish, minimal) */
    #meters { position: absolute; left: 18px; bottom: 16px; width: 200px; font: 700 11px/1 var(--h-head); letter-spacing: 0.12em; color: var(--h-ink); text-shadow: var(--h-shadow); pointer-events: none; opacity: 0.92; }
    #meters .m { position: relative; height: 20px; margin-top: 6px; }
    #meters .m .lab { position: absolute; left: 0; top: 0; }
    #meters .m .num { position: absolute; right: 0; top: 0; font: 9px/1 var(--h-mono); color: var(--h-hi); letter-spacing: 0.06em; }
    #meters .m .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; border: 1px solid rgba(var(--h-edge),0.55); background: rgba(var(--h-plate),0.5); }
    #meters .m .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--h-ink); transition: width .08s linear; }
    #meters .m .peak { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--h-hi); opacity: 0; }
    #meters .m .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: repeating-linear-gradient(90deg, transparent 0 19px, rgba(var(--h-edge),0.28) 19px 20px); }
    #meters.hot .m.light .fill { background: var(--h-acc); }
    /* radio traffic (overlay.ts): only what goes over a net — the guards' channel you are listening in on, and (later) your own side. Everything else the old
       message log printed is carried by the interaction panel, the kit column and the world itself. */
    #log { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); max-width: min(620px, 70vw / var(--tz, 1)); font: italic 12px/1.45 var(--h-font); color: var(--h-ink); text-align: center; text-shadow: var(--h-shadow); white-space: pre-wrap; pointer-events: none; letter-spacing: 0.02em; }
    #log .rx { display: block; opacity: 0.92; } #log .rx b { font: 700 11px/1 var(--h-head); color: var(--h-hi); letter-spacing: 0.12em; margin-right: 6px; } #log .rx.old { opacity: 0.5; }
    /* mission: one objective line top-centre and a small diamond on (or, clamped to the screen edge, toward) the current objective — the same caps as the meters; the objective is one of the things the orange is for (overlay.ts) */
    #objective { position: absolute; left: 50%; top: 5px; padding: 5px 12px 4px; background: rgba(var(--h-plate),0.5); border-radius: 2px; transform: translateX(-50%); font: 12px/1 var(--h-font); letter-spacing: 0.02em; color: var(--h-ink); text-shadow: var(--h-shadow); white-space: pre; pointer-events: none; opacity: 0.95; }
    #objective b { margin-right: 3px; font: 700 11px/1 var(--h-head); letter-spacing: 0.16em; text-transform: uppercase; color: var(--h-acc); } #objective.done b, #objective.failed b { color: inherit; }
    /* A TUTORIAL MISSION'S ONE LINE (ui/overlay.ts, game/rails.ts): big, low in the middle, the keys it names drawn as keys, a pip a step */
    #railprompt { position: absolute; left: 50%; bottom: max(13%, 112px); transform: translateX(-50%) translateY(calc(var(--railshift, 0px) + var(--railman, 0px))); transition: transform .18s ease-out; display: none; flex-direction: column; align-items: center; gap: 9px; pointer-events: none; z-index: 6; }
    body.onrails #log { bottom: var(--raillog, 30px); transition: bottom .18s ease-out; } body.onrails #log .rx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* (the net's rows stay under a tutorial mission's line: three of them, one line each, never up over it — and when the line is at the bottom edge, clear of your men, they stand just above it: ui/railclear.ts) */
    #railprompt.on { display: flex; animation: railin .45s cubic-bezier(.2,.9,.3,1.2); }
    #railprompt .line { padding: 13px 26px 12px; background: rgba(var(--h-plate),0.78); border-radius: 4px; border-bottom: 2px solid var(--h-acc); font: 600 27px/1.25 var(--h-head); letter-spacing: 0.02em; color: var(--h-hi); text-shadow: var(--h-shadow); white-space: normal; text-align: center; text-wrap: balance; width: max-content; max-width: max(320px, calc(100vw / var(--tz, 1) - 860px)); }
    body.skyseat #railprompt .line { max-width: calc(86vw / var(--tz, 1)); }   /* (the kit panel owns the lower left 400 px: a long line breaks in two beside it; in the sky seat there is no kit panel) */
    #railprompt kbd { display: inline-block; min-width: 22px; margin: 0 3px; padding: 3px 9px 2px; border-radius: 5px; background: var(--h-acc); color: var(--h-on); box-shadow: 0 3px 0 rgba(0,0,0,0.45); font: 700 24px/1.2 var(--h-head); text-align: center; text-shadow: none; position: relative; top: -2px; }
    #railprompt .note { padding: 5px 14px 4px; background: var(--h-acc); color: var(--h-on); border-radius: 4px; font: 700 17px/1.2 var(--h-head); letter-spacing: 0.03em; } #railprompt .note:empty { display: none; } #railprompt .line:empty { display: none; }   /* (a tap the step refused: what to do instead, under the line) */
    #railprompt .note kbd { min-width: 16px; padding: 1px 6px 0; margin: 0 2px; background: var(--h-on); color: var(--h-acc); font-size: 15px; box-shadow: none; top: 0; }
    #railprompt .nb, #railcard .nb { white-space: nowrap; }
    /* (a line with no key in it — what the men are doing, a fight to watch: smaller, no rule of the accent's under it, a dot that beats beside it) */
    #railprompt .line.watch { font-weight: 500; font-size: 21px; border-bottom-color: rgba(var(--h-edge),0.45); opacity: 0.92; }
    #railprompt .line.watch::before { content: ''; display: inline-block; width: 8px; height: 8px; margin: 0 12px 2px 0; border-radius: 50%; background: var(--h-acc); animation: railwatch 1.1s ease-in-out infinite; }
    @keyframes railwatch { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
    #railprompt .line.nudge { animation: railnudge .32s ease-in-out; } @keyframes railnudge { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
    #railprompt .pips { display: flex; gap: 6px; } #railprompt .pips i { width: 9px; height: 4px; border-radius: 2px; background: rgba(var(--h-edge),0.35); }
    #railprompt .pips i.done { background: var(--h-acc); opacity: 0.75; } #railprompt .pips i.now { background: var(--h-hi); width: 18px; }
    /* A TUTORIAL STEP'S CARD (ui/railcard.ts): a heading and a few sentences in the middle, the world held still behind it (main.ts). In the HUD's layer, so by
       ui/textsize.ts's rule its one viewport unit is divided by the factor */
    #railcard { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 12; pointer-events: auto; background: rgba(0,0,0,0.42); }
    #railcard.on { display: flex; animation: railcardin .22s ease-out; }
    #railcard .rc { box-sizing: border-box; width: min(540px, calc(100vw / var(--tz, 1) - 48px)); padding: 26px 30px 24px; background: rgba(var(--h-plate),0.95); border-top: 3px solid var(--h-acc); border-radius: 4px; box-shadow: 0 18px 60px rgba(0,0,0,0.6); }
    #railcard h2 { margin: 0 0 14px; font: 700 27px/1.1 var(--h-head); letter-spacing: 0.04em; text-transform: uppercase; color: var(--h-hi); }
    #railcard p { margin: 0 0 10px; font: 17px/1.5 var(--h-font); color: var(--h-ink); text-wrap: pretty; }
    #railcard p kbd, #railcard h2 kbd { display: inline-block; min-width: 16px; margin: 0 2px; padding: 1px 7px 0; border-radius: 4px; background: var(--h-acc); color: var(--h-on); font: 700 15px/1.3 var(--h-head); text-align: center; }
    #railcard button { margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 11px 18px 9px; background: var(--h-acc); color: var(--h-on); border: 0; border-radius: 4px; font: 700 19px/1 var(--h-head); letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
    #railcard button:hover { filter: brightness(1.1); }
    #railcard button kbd { padding: 3px 7px 2px; border-radius: 3px; background: var(--h-on); color: var(--h-acc); font: 700 11px/1 var(--h-head); letter-spacing: 0.14em; }
    @keyframes railcardin { from { opacity: 0; } to { opacity: 1; } }
    @keyframes railin { from { opacity: 0; transform: translateX(-50%) translateY(calc(14px + var(--railshift, 0px) + var(--railman, 0px))) scale(0.96); } to { opacity: 1; transform: translateX(-50%) translateY(calc(var(--railshift, 0px) + var(--railman, 0px))); } }   /* (the line comes in where it stands: a ring's step and the step to the bottom edge clear of your men — ui/railclear.ts — are in both ends) */
    @media (max-width: 900px) { #railprompt .line { font-size: 20px; white-space: normal; text-align: center; } #railprompt .line.watch { font-size: 17px; } #railprompt kbd { font-size: 18px; } }
    body.skyseat #equip, body.skyseat #meters { display: none !important; }
    /* a tutorial mission: the place its one line points at is a ring that beats, not a small diamond */
    body.onrails .objmark { transform: translate(-50%, -50%); }
    body.onrails .objmark i { width: 26px; height: 26px; border-width: 3px; border-radius: 50%; transform: none; box-shadow: 0 0 10px rgba(0,0,0,0.7), inset 0 0 6px rgba(0,0,0,0.5); animation: railbeat 1.05s ease-out infinite; }
    body.onrails .objmark.edge i { width: 14px; height: 14px; }
    /* (a step's `toward`: the mark is three chevrons lying from the place to where it points, lit one after another that way) */
    .objmark u { display: none; }
    body.onrails .objmark.arrow i { display: none; }
    body.onrails .objmark.arrow u { display: flex; position: absolute; left: 50%; top: 50%; text-decoration: none; transform-origin: 0 50%; transform: translateY(-50%) rotate(var(--turn, 0deg)); }
    body.onrails .objmark.arrow u b { display: block; width: 18px; height: 18px; margin-right: 2px; border-top: 6px solid var(--h-acc); border-right: 6px solid var(--h-acc); transform: rotate(45deg); filter: drop-shadow(0 0 4px rgba(0,0,0,0.85)); animation: railarrow 0.9s linear infinite; }
    body.onrails .objmark.arrow u b:nth-child(2) { animation-delay: 0.15s; } body.onrails .objmark.arrow u b:nth-child(3) { animation-delay: 0.3s; }
    body.onrails .objmark.arrow span { margin-top: 22px; }
    @keyframes railarrow { 0%, 60%, 100% { opacity: 0.3; } 20% { opacity: 1; } }
    @keyframes railbeat { 0% { outline: 3px solid var(--h-acc); outline-offset: 0; } 100% { outline: 3px solid transparent; outline-offset: 22px; } }
    /* what Tab shows (ui/tabcard.ts, ui/tabkey.ts 'brief'): the objective in full and the squad, over a held game */
    #tabcard { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-sizing: border-box; width: min(560px, 86vw / var(--tz, 1)); max-height: calc(82vh / var(--tz, 1)); overflow-y: auto; padding: 16px 20px 12px; background: rgba(var(--h-plate),0.94); border: 1px solid rgba(var(--h-edge),0.55); border-radius: 3px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); font: 13px/1.4 var(--h-font); letter-spacing: 0.01em; color: var(--h-ink); z-index: 13; }   /* (over the HUD's own layers and a line being said; under the pause card and the lists) */
    #tabcard.on { display: block; } #tabcard section + section { margin-top: 14px; }
    #tabcard h4 { display: flex; justify-content: space-between; gap: 10px; margin: 0 0 6px; font: 700 11px/1 var(--h-head); letter-spacing: 0.16em; text-transform: uppercase; color: var(--h-acc); } #tabcard h4 em { font: 400 11px/1 var(--h-font); letter-spacing: 0.02em; text-transform: none; color: var(--h-dim); }
    #tabcard p { margin: 0; color: var(--h-hi); } #tabcard ul { margin: 6px 0 0; padding: 0; list-style: none; columns: 2; column-gap: 18px; }
    #tabcard li { position: relative; padding-left: 16px; break-inside: avoid; } #tabcard li::before { content: '○'; position: absolute; left: 0; color: var(--h-dim); } #tabcard li.done { color: var(--h-soft); } #tabcard li.done::before { content: '✓'; color: var(--h-acc); } #tabcard li.now { color: var(--h-hi); } #tabcard li.now::before { content: '▸'; color: var(--h-acc); }
    #tabcard .man { display: grid; grid-template-columns: 96px minmax(0, 1fr); column-gap: 10px; padding: 4px 0; border-top: 1px solid rgba(var(--h-edge),0.14); } #tabcard .man b { color: var(--h-hi); } #tabcard .man i { grid-column: 2; font-style: normal; font-size: 11px; color: var(--h-soft); } #tabcard .man.down b, #tabcard .man.down span { text-decoration: line-through; opacity: 0.6; }
    #tabcard .carry { margin-top: 5px; font-size: 12px; color: var(--h-soft); } #tabcard .carry:first-of-type { padding-top: 6px; border-top: 1px solid rgba(var(--h-edge),0.14); }
    #tabcard footer { margin-top: 14px; font-size: 11px; color: var(--h-dim); } #tabcard kbd { display: inline-block; margin: 0 2px; padding: 1px 5px 0; border-radius: 2px; background: rgba(var(--h-edge),0.8); color: var(--h-on); font: 700 9px/1.25 var(--h-mono); letter-spacing: 0.06em; vertical-align: 1px; }
    #objective:empty { display: none; } #objective.done { color: var(--h-hi); } #objective.failed { color: #f0a090; }
    /* alarm stage (Chaos-Theory-style): hidden at calm; ALARM I amber while the floor is heightened, ALARM II red on lockdown, with the level's clock and
       a pulsing pip while an alarm episode is actually running (someone is alert / searching) */
    #alarm { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); font: 700 11px/1 var(--h-head); letter-spacing: 0.22em; text-shadow: var(--h-shadow); white-space: pre; pointer-events: none; opacity: 0; transition: opacity .4s; }
    #alarm.on { opacity: 0.95; } #alarm.l1 { color: #f3c86a; } #alarm.l2 { color: #ff7a5c; }
    #alarm i { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: currentColor; vertical-align: 1px; opacity: 0.35; }
    #alarm.live i { animation: alarmPip 0.9s ease-in-out infinite; opacity: 1; }
    @keyframes alarmPip { 50% { opacity: 0.25; } }
    /* checkpoint tag (game/savestate.ts, overlay.ts): a discreet CHECKPOINT under the objective line for a couple of seconds when one is written / loaded */
    #checkpoint { position: absolute; right: 14px; top: 10px; font: 700 11px/1 var(--h-head); letter-spacing: 0.26em; color: var(--h-ink); text-shadow: var(--h-shadow); white-space: pre; pointer-events: none; opacity: 0; transition: opacity .5s; }
    #checkpoint.on { opacity: 0.8; transition: opacity .15s; }
    #checkpoint b { display: inline-block; width: 5px; height: 5px; margin-right: 7px; transform: rotate(45deg); background: currentColor; vertical-align: 1px; }
    body.touring #checkpoint { display: none; }
    /* the session journal's REC tag (game/journal.ts, overlay.ts; F10): under the checkpoint tag, red while recording, amber while it waits for a moment it may start on */
    #journal { position: absolute; right: 14px; top: 26px; font: 700 11px/1 var(--h-head); letter-spacing: 0.16em; color: #e8b04c; text-shadow: var(--h-shadow); white-space: pre; pointer-events: none; opacity: 0; transition: opacity .3s; }
    #journal.on { opacity: 0.9; }
    #journal.rec { color: #ff5a4e; }
    .objmark { position: absolute; transform: translate(-50%, -5px); pointer-events: none; text-align: center; }
    .objmark i { display: block; width: 7px; height: 7px; margin: 0 auto; border: 1.5px solid var(--h-acc); transform: rotate(45deg); box-shadow: 0 0 5px rgba(0,0,0,0.8); }
    .objmark span { display: block; margin-top: 6px; font: 700 11px/1 var(--h-head); letter-spacing: 0.14em; color: var(--h-hi); text-shadow: var(--h-shadow); white-space: nowrap; }
    .objmark.edge i { border-color: var(--h-acc); box-shadow: none; }

    /* the four ways a mission can be won (ui/verdictPips.ts: the end card's head, a mission's card): won = lit, the rest dim, two won = the gold frame; under a
       lit mark a '1' = at the first try, a bar = nobody lost */
    .vpips { display: inline-flex; align-items: flex-start; gap: 6px; padding: 3px 5px; border: 1px solid transparent; vertical-align: middle; }
    .vpips.gold { border-color: #e8c15a; }

    .vpip.won { color: #d2c9b5; } .vpip.now { color: #f0e9d9; } .vpip.now .vico { outline: 1px solid #f0e9d9; outline-offset: 2px; }
    .vpip .vmarks { display: flex; align-items: center; gap: 2px; height: 7px; }

    .vpip .vall { display: block; width: 9px; height: 2px; background: currentColor; text-decoration: none; visibility: hidden; } .vpip .vall.on { visibility: visible; }
    /* the same pips on a mission's card on the start page (ui/verdictRows.ts): at the right of the card's last line, small; four dim marks until a way is won */
    /* (on a mission's CARD: the foot line the menus keep empty for it — column 3 of row 3, 17 px tall. The strip is 17 px with its frame — an 11 px mark over 4 px
       of ticks — so a card is the height it was; it is no link and takes no pointer, the card under it is; colours are the menu's own tokens, the gold
       frame a pale sand that is not the selection's orange. Text rows — ?nogroups, the older card's list — show none.) */

    #missions.one .mgrid .mrow > .vpips { display: inline-flex; grid-column: 3; grid-row: 3; justify-self: end; align-self: center; margin: 0 5px 0 auto; padding: 0 3px; gap: 4px; pointer-events: none; }

    #missions .mrow > .vpips .vmarks { height: 4px; gap: 1px; } #missions .mrow > .vpips .v1 { font-size: 6px; line-height: 4px; } #missions .mrow > .vpips .vall { width: 6px; height: 1px; }
    #missions .mrow > .vpips.none { opacity: 0.6; }
    #caption { position: absolute; left: 50%; top: 11%; transform: translateX(-50%); width: min(760px, 88vw / var(--tz, 1)); text-align: center; pointer-events: none; opacity: 0; transition: opacity .5s; padding: 14px 22px 16px; border-radius: 3px; background: linear-gradient(180deg, rgba(var(--h-plate),0.62), rgba(var(--h-plate),0.44)); box-shadow: 0 10px 40px rgba(0,0,0,0.35); border-top: 1px solid rgba(var(--h-edge),0.2); }

    /* the orders ring at the cursor (ui/cmdring.ts — a prototype, ?cmd): a wedge a digit, the lit one filled, a row that cannot be given greyed */

    .cmdhint { color: #f2cf6b; } .cmdhint.t-red { color: #ff9a8a; } .cmdhint.t-blue { color: #9cc8ff; } .cmdhint.k-foe { color: #ff7a6a; }

    .plan { color: var(--h-hi); } .plan .t-gold { color: #f2cf6b; } .plan .t-red { color: #ff9a8a; } .plan .t-blue { color: #9cc8ff; }

    .plan .pf { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-opacity: 0.45; stroke-width: 1; stroke-dasharray: 2 3; stroke-linejoin: round; } .plan .pf.there { fill-opacity: 0.13; stroke-dasharray: none; }

    .plan .pw.thr { fill: currentColor; fill-opacity: 0.14; stroke-width: 2; }
    .plan .pa { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 6; }
    .plan .pe { fill: currentColor; fill-opacity: 0.2; stroke: currentColor; stroke-width: 1.5; }
    .plan .pr { fill: currentColor; fill-opacity: 0.04; stroke: currentColor; stroke-opacity: 0.55; stroke-width: 1; stroke-dasharray: 2 7; }
    .plan .pt { font: 700 10px/1 var(--h-head); fill: currentColor; paint-order: stroke; stroke: rgba(var(--h-plate),0.72); stroke-width: 3px; stroke-linejoin: round; } .plan .pt.there { fill-opacity: 0.8; }

    .plan .w-charge .pk, .plan .w-wall .pk { fill: currentColor; } .plan .w-charge .pkt, .plan .w-wall .pkt { fill: var(--h-base); }

    /* kit, bottom-left, a column standing on the light / sound meters (Chaos-Theory-style): the key strip (the selected gun's light · night vision) and the condition

    #equip { position: absolute; left: 18px; bottom: 86px; min-width: 200px; font: 11px/1.15 var(--h-font); color: var(--h-ink); text-shadow: var(--h-shadow); pointer-events: none; display: flex; flex-direction: column; align-items: stretch; gap: 4px; }

    #equip .pace { display: flex; align-items: center; gap: 8px; font: 600 10px/1.3 var(--h-head); letter-spacing: 0.14em; color: var(--h-soft); padding: 1px 7px; }
    #equip .pace .ticks { display: inline-flex; gap: 3px; } #equip .pace .ticks i { width: 9px; height: 6px; border: 1px solid rgba(var(--h-edge),0.5); } #equip .pace .ticks i.on { background: var(--h-hi); box-shadow: 0 0 4px rgba(0,0,0,0.5); }
